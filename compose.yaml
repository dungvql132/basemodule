version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_container
    restart: always
    environment:
      SA_PASSWORD: "NewP@ssw0rd123"
      ACCEPT_EULA: "Y"
      MSSQL_TLS_DISABLED: "1"
      TRUSTSERVERCERTIFICATE: "true"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
